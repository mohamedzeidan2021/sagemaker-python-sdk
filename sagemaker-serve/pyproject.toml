[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemaker-serve"
dynamic = ["version"]
description = "SageMaker Serve package for model serving and deployment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Amazon Web Services"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sagemaker-core>=2.23.0",
    "sagemaker-train>=1.23.0",
    "boto3>=1.42.2,<2.0",
    "botocore>=1.35.75,<2.0",
    "deepdiff",
    "mlflow",
    "sagemaker_schema_inference_artifacts",
    "tqdm",
    "psutil",
]

[project.optional-dependencies]
# torch and the Triton/ONNX client stack are only needed for local/in-process serving and
# tensor (de)serialization. Keeping them optional avoids pulling ~2 GB of CUDA wheels into
# every install of sagemaker / sagemaker-mlops. Every torch reference in this package is
# resolved lazily.
torch = ["torch>=2.0.0"]
triton = ["tritonclient[http]", "onnx", "onnxruntime"]
all = ["sagemaker-serve[torch,triton]"]
test = [
    "sagemaker-serve[torch,triton]",
    "pytest",
    "pytest-cov",
    "mock",
]
dev = [
    "pytest",
    "pytest-cov", 
    "mock",
    "black",
    "flake8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sagemaker*"]
namespaces = true

[tool.setuptools.package-data]
"sagemaker.serve" = ["schema/*.json"]

[tool.setuptools.dynamic]
version = { file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "skip_in_pr_check: mark a test that is excluded from PR check runs. Long-running or hang-prone tests that would otherwise push the run past the CodeBuild timeout; they run in a dedicated scheduled CI run instead.",
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
